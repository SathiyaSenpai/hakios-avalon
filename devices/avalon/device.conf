# devices/avalon/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device avalon
	title       OnePlus Nord 4
	vendor      OnePlus
	soc         cliffs
	defconfig   avalon_defconfig
	firmware    pull-firmware.sh
	maintainer  sathiya
	status      display     works     the panel through continuous splash framebuffer at 0xe3940000 (1240x2772, 120Hz)
	status      touch       works     Synaptics S3910 on QUPv3 SE4 SPI (CONFIG_HAKIOS_S3910, touchscreen=1); RPMh ACTIVE_TCS3, APP_INFO, and TouchComm v1 parser
	status      buttons     works     power and volume through PMK8550 PON & PMXR2230 GPIO6 (CONFIG_HAKIOS_BUTTONS)
	status      cpu         works     all 8 Kryo cores (3 A520, 4 A720, 1 X4) via EPSS v2 with thermal DVFS throttling; bootcpu=7 cpus=8 default
	status      thermal     works     34/35 active TSENS v2 sensors across 3 blocks (CONFIG_HAKIOS_THERMAL, thermal=1) + DVFS feedback
	status      haptic      works     Awinic AW86927 LRA on QUPv3 SE3 I2C @ 0x5a, gpio 12/13/145/147 (haptic=5)
	status      battery     partial   BQ28Z610 I2C fuel gauge on gpio176/177 @ 0x55 with fallback when UEFI charger is absent or invalid
	status      storage     partial   UFS read-only survey via UEFI block service (ufs=1/2); U-Boot currently keeps ufshc disabled (RAM-boot uses resident system.apfs)
	status      gpu         partial   Adreno 732 (gen7-11-0 @ 0x3d00000) bringup + GMU/ZAP + Turnip/Metal2Vulkan (m2v=1); safely falls back to software rendering if firmware absent
	status      wifi        partial   WCN6750 Cliffs (SM7675) offsets, SPMI v7/RPMh, TLMM (35/156/80), SMMU stream 0x1400, MSI 0x17110040, bdwlan.elf/regdb.bin wired; needs wpss.* from modem/NON-HLOS partition
	status      bluetooth   partial   WCN6750 pins (35/156/80), SPMI/RPMh rails (L7B/S1B/S2B/S3B/S3E), and hsuart0 GENI UART (0x888000, gpio 40..43) wired via bt=1..3; needs msbtfw*/msnv* from bt_firmware partition
	status      audio       partial   Cliffs ADSP/LPASS (0x9d400000, IPCC 0x406000, RSC v3.2 0x17a20000) wired; needs adsp.* from modem/dsp partition and TFA98xx speaker amp port
	status      cellular    partial   Cliffs MPSS (0x8bc00000, 0xcd00000), modem_dtb (0x98900000), IPA (0x3e40000), GSI (0x3e04000), RSC v3.2 wired; needs modem.*/ipa_fws.* from modem partition
